<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- If TH SarabunPSK is missing, use Laksaman (same metrics) instead of a wider font. -->
  <alias binding="same"><family>TH SarabunPSK</family><prefer><family>TH SarabunPSK</family><family>Laksaman</family></prefer></alias>
  <!-- Checkbox symbols in the KP forms. -->
  <alias binding="same"><family>Segoe UI Symbol</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
